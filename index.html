<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>YouBike 調度任務</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ccircle cx='11' cy='21' r='5' fill='none' stroke='%232563eb' stroke-width='2.5'/%3E%3Ccircle cx='23' cy='21' r='5' fill='none' stroke='%232563eb' stroke-width='2.5'/%3E%3Cpath d='M11 21l4-9h5' stroke='%23f59e0b' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============================================================
   設計代號：調度員在騎樓、單手、陽光下操作。
   => 大字、高對比、按鈕至少 44px、關鍵數字一眼可讀。
   ============================================================ */
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --ink-2:#475569; --ink-3:#94a3b8;
  --line:#e2e8f0; --brand:#2563eb; --brand-d:#1d4ed8;
  --short:#dc2626; --short-bg:#fef2f2; --short-line:#fecaca;
  --full:#d97706;  --full-bg:#fffbeb;  --full-line:#fde68a;
  --ok:#059669;    --ok-bg:#ecfdf5;
  --sheet-pad: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none !important}

/* ---------- 頁首 ---------- */
.topbar{
  position:sticky; top:0; z-index:600; background:#0f172a; color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
.topbar h1{font-size:15px;font-weight:800;margin:0;letter-spacing:.02em;flex:1}
.topbar .sub{font-size:11px;color:#94a3b8;font-weight:500}
.avatar{width:30px;height:30px;border-radius:50%;background:#334155;object-fit:cover;flex:none}
.iconbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#1e293b;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:#e2e8f0;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.wrap{padding:14px 14px 24px;max-width:640px;margin:0 auto}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.muted{color:var(--ink-2)}
.tiny{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.pill-short{background:var(--short-bg);color:var(--short);border:1px solid var(--short-line)}
.pill-full{background:var(--full-bg);color:var(--full);border:1px solid var(--full-line)}
.pill-ok{background:var(--ok-bg);color:var(--ok);border:1px solid #a7f3d0}
.pill-gray{background:#f1f5f9;color:var(--ink-2);border:1px solid var(--line)}
.pill-urgent{background:var(--short);color:#fff}
.pill-top{background:var(--brand);color:#fff}

/* ---------- 列表頁 ---------- */
.listhead{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 12px}
.listhead b{font-size:19px;font-weight:900;letter-spacing:-.01em}
.taskcard{width:100%;text-align:left;padding:14px;margin-bottom:10px;display:block;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 1px 2px rgba(15,23,42,.04); transition:transform .08s, box-shadow .12s}
.taskcard:active{transform:scale(.985);box-shadow:0 0 0 2px rgba(37,99,235,.25)}
.taskcard.is-done{opacity:.55}
.taskcard.is-top{border-color:#bfdbfe;box-shadow:0 0 0 1px #bfdbfe,0 1px 2px rgba(15,23,42,.04)}
.sorthint{font-size:11px;color:var(--ink-3);margin:-6px 4px 12px;line-height:1.5}
.taskcard.mine{border-color:#a7f3d0;background:linear-gradient(180deg,#f0fdf9,#fff)}
.mine-bar{height:5px;border-radius:99px;background:#d1fae5;overflow:hidden;margin-top:10px}
.mine-bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.tc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tc-time{font-size:12px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tc-rank{font-size:12px;font-weight:900;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tc-title{font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.tc-crit{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;align-items:baseline;gap:8px}
.tc-crit span{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tc-stats{display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.stat{flex:none}
.stat b{display:block;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:10px;color:var(--ink-3);font-weight:700}
.tc-arrow{margin-left:auto;align-self:center;color:var(--ink-3);font-size:20px}

/* ---------- 詳情頁 ---------- */
.detail-hero{padding:15px;margin-bottom:12px}
.dh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dh-title{font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.dh-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}
.metric{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:8px 6px;text-align:center}
.metric b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.metric span{font-size:10px;color:var(--ink-3);font-weight:700}

.banner{display:flex;gap:9px;padding:11px 13px;border-radius:13px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.5}
.banner-warn{background:var(--short-bg);border:1px solid var(--short-line);color:#991b1b}
.banner-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#map{height:210px;border-radius:16px;border:1px solid var(--line);margin-bottom:12px;background:#e2e8f0;z-index:1}
.route-strip{height:auto !important;background:#fff !important;padding:13px}
.rs-head{font-size:12px;font-weight:900;margin-bottom:11px;display:flex;justify-content:space-between;align-items:baseline}
.rs-head span{font-size:10px;font-weight:700;color:var(--ink-3)}
.rs-body{display:flex;align-items:flex-start;gap:2px;overflow-x:auto;padding-bottom:3px}
.rs-node{flex:1;min-width:66px;text-align:center}
.rs-name{font-size:10.5px;font-weight:800;line-height:1.35;word-break:break-all}
.rs-move{font-size:11px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.rs-arrow{color:var(--ink-3);font-size:13px;padding-top:6px;flex:none}
.rt-marker{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
  color:#fff;font-weight:900;font-size:13px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}

/* AI 說明 */
.ai{padding:14px;margin-bottom:12px;background:linear-gradient(180deg,#fff,#fafbff)}
.ai-head{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.ai-head b{font-size:13px;font-weight:900;flex:1}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.ai-body{font-size:13.5px;line-height:1.75;color:#1e293b}
.ai-src{margin-top:9px;font-size:10.5px;color:var(--ink-3)}
.regen{padding:5px 11px;border-radius:9px;background:#eff6ff;color:var(--brand-d);font-size:11px;font-weight:800}
.regen:disabled{opacity:.5}
.skeleton{height:13px;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7);
  background-size:200% 100%;animation:sk 1.1s linear infinite;margin-bottom:7px}
@keyframes sk{to{background-position:-200% 0}}

/* 站點時間軸 */
.section-h{font-size:13px;font-weight:900;margin:16px 4px 10px;display:flex;align-items:center;gap:7px}
.section-h .count{font-weight:700;color:var(--ink-3);font-size:11px}
.stops{position:relative;padding-left:30px;padding-bottom:6px}
.stops::before{content:"";position:absolute;left:13px;top:16px;bottom:16px;width:2px;background:var(--line)}
.stop{position:relative;margin-bottom:10px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:15px}
.stop.done{background:#f8fafc}
.stop-dot{position:absolute;left:-30px;top:14px;width:28px;height:28px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;border:2.5px solid var(--bg)}
.stop-name{font-size:16px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.stop-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.action-row{display:flex;align-items:center;gap:10px;margin:11px 0 9px;padding:9px 11px;border-radius:12px}
.action-pickup{background:var(--full-bg);border:1px solid var(--full-line)}
.action-drop{background:#eff6ff;border:1px solid #bfdbfe}
.action-big{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.action-lbl{font-size:11px;font-weight:800;opacity:.85}
.action-load{margin-left:auto;text-align:right;font-size:10.5px;color:var(--ink-2);font-weight:700}
.action-load b{display:block;font-size:14px;font-variant-numeric:tabular-nums}

.gauge{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:8px 0 5px}
.gauge i{display:block;height:100%;border-radius:99px}
.gauge-row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.why{font-size:11.5px;color:var(--ink-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}
.stop-btns{display:flex;gap:8px;margin-top:11px}
.btn{flex:1;min-height:44px;border-radius:12px;font-size:13.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-nav{background:#f1f5f9;color:#334155;border:1px solid var(--line)}
.btn-done{background:var(--brand);color:#fff}
.btn-done.is-done{background:var(--ok-bg);color:var(--ok);border:1px solid #a7f3d0}
.btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}

/* 底部固定操作列 */
.dock{position:sticky;bottom:0;z-index:500;background:linear-gradient(180deg,rgba(241,245,249,0),var(--bg) 28%);
  padding:16px 14px calc(14px + var(--sheet-pad));margin:0 -14px -24px;display:flex;gap:9px}
.dock .btn{min-height:50px;font-size:15px;font-weight:900;box-shadow:0 4px 14px rgba(15,23,42,.1)}
.btn-accept{background:var(--brand);color:#fff;flex:2}
.btn-decline{background:#fff;color:var(--ink-2);border:1px solid #cbd5e1;flex:1}
.btn-finish{background:var(--ok);color:#fff;flex:1}

/* ---------- 回報表單（底部彈出） ---------- */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:#fff;
  border-radius:22px 22px 0 0;padding:6px 18px calc(18px + var(--sheet-pad));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.grabber{width:38px;height:4px;border-radius:99px;background:#cbd5e1;margin:8px auto 14px}
.sheet h3{margin:0 0 3px;font-size:18px;font-weight:900;letter-spacing:-.01em}
.sheet .sh-sub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:7px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:46px;height:46px;border-radius:13px;background:#f1f5f9;border:1px solid var(--line);
  font-size:22px;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center}
.stepper button:active{background:#e2e8f0}
.stepper input{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:13px;height:46px;background:#fff;color:var(--ink)}
.hintline{font-size:11px;color:var(--ink-3);margin-top:6px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;font:inherit;
  font-size:14px;resize:none;background:#fff;color:var(--ink)}
textarea:focus,.stepper input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.sheet-submit{width:100%;min-height:50px;border-radius:14px;background:var(--brand);color:#fff;font-size:15px;font-weight:900}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);z-index:950;
  background:#0f172a;color:#fff;padding:11px 18px;border-radius:13px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.footnote{margin-top:18px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:13px;
  font-size:10.5px;color:var(--ink-3);line-height:1.7}
</style>
</head>
<body>

<div class="topbar">
  <img id="me-avatar" class="avatar" alt="">
  <div style="min-width:0;flex:1">
    <h1 id="top-title">調度任務</h1>
    <div class="sub" id="top-sub">載入中…</div>
  </div>
  <button class="iconbtn" id="btn-log" onclick="goLog()" aria-label="調度日誌">
    <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 13l2.5 2.5L16 10"/></svg>
  </button>
  <button class="iconbtn hide" id="btn-back" onclick="goList()" aria-label="返回列表">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
</div>

<div class="wrap">

  <!-- 任務列表 -->
  <div id="view-list">
    <div id="my-tasks" class="hide"></div>
    <div class="listhead" id="pending-head"><b>待處理派工</b><span class="tiny muted" id="list-count"></span></div>
    <div class="sorthint" id="sort-hint"></div>
    <div id="task-list"></div>
    <div class="footnote" id="model-footnote"></div>
  </div>

  <!-- 任務詳情 -->
  <div id="view-detail" class="hide"></div>
</div>

<!-- 回報表單 -->
<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grabber"></div>
  <h3 id="sheet-title">到站回報</h3>
  <div class="sh-sub" id="sheet-sub"></div>

  <div class="field">
    <label for="rp-count">實際搬運台數</label>
    <div class="stepper">
      <button type="button" onclick="bumpCount(-1)" aria-label="減少">−</button>
      <input id="rp-count" type="number" inputmode="numeric" value="0" min="0" max="40">
      <button type="button" onclick="bumpCount(1)" aria-label="增加">＋</button>
    </div>
    <div class="hintline" id="rp-hint"></div>
  </div>

  <div class="field">
    <label>現場狀況</label>
    <div class="chips" id="rp-chips"></div>
  </div>

  <div class="field">
    <label for="rp-note">補充說明（選填）</label>
    <textarea id="rp-note" rows="2" placeholder="例：車柱 3、7 號故障，已通報維修"></textarea>
  </div>

  <button class="sheet-submit" onclick="submitReport()">送出回報</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="tasks.js"></script>
<script>
/* ============================================================================
   設定區 —— 上線只要改這三行
   ============================================================================ */
const CONFIG = {
  liffId:  '',   // 例：'2006xxxxxx-AbCdEfGh'。留空＝桌面瀏覽器展示模式
  apiBase: '',   // 例：'https://xxxx.execute-api.ap-northeast-1.amazonaws.com/prod'
                 // 留空＝不打後端，所有操作只存在本機（demo 可用）
  truckCapacity: 20,
};

/* ============================================================================
   狀態
   ============================================================================ */
let DATA = null;              // tasks.json 內容
let profile = { displayName: '調度員', userId: 'demo-user', pictureUrl: '' };
let inClient = false;
let currentTask = null;
let map = null, mapLayer = null;
let sheetCtx = null;
let progress = {};            // { [taskId]: { status, stops:{ [stationId]: {...} } } }
let myTaskIds = new Set();    // 後端回報「已指派給我」的工單

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* localStorage 在部分預覽環境會丟例外，一律包起來 */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ============================================================================
   啟動
   ============================================================================ */
(async function boot() {
  progress = store.get('yb_progress', {});

  // 1) 資料：優先用 tasks.js 帶進來的 window.__TASKS__，否則 fetch
  try {
    DATA = window.__TASKS__ || await (await fetch('tasks.json', { cache: 'no-store' })).json();
  } catch (e) {
    $('task-list').innerHTML = '<div class="empty">找不到 tasks.json。<br>請確認它和 index.html 放在同一層。</div>';
    $('top-sub').textContent = '資料載入失敗';
    return;
  }

  // 2) LIFF：沒填 liffId 就走展示模式，桌面瀏覽器可直接開
  // 提示文字必須分開講「LINE 身分」與「後端連線」兩件事，
  // 否則會出現「明明有送到後端卻說不會送出」這種誤導。
  // 連線狀態只寫進 console，不在畫面上掛橫幅——
  // 這裡顯示的是實際的 tasks.json，不是捏造的數字，沒有需要對觀眾聲明的東西。
  const backendNote = () => CONFIG.apiBase ? '後端已連線' : '後端未設定，操作只存在本機';

  if (CONFIG.liffId && window.liff) {
    try {
      await liff.init({ liffId: CONFIG.liffId });
      inClient = liff.isInClient();
      if (liff.isLoggedIn()) {
        const p = await liff.getProfile();
        profile = { displayName: p.displayName, userId: p.userId, pictureUrl: p.pictureUrl };
      } else if (!inClient) {
        liff.login();
        return;
      }
    } catch (e) {
      console.warn('LINE 身分驗證失敗：' + e.message + '｜' + backendNote());
    }
  } else if (CONFIG.liffId) {
    console.warn('LINE SDK 未載入（可能被網路阻擋）｜' + backendNote());
  } else {
    console.warn('未設定 LIFF ID，未連結 LINE 身分｜' + backendNote());
  }

  // Flex 卡片的按鈕會帶 ?taskId=T003 進來，直接開那一筆，不要讓調度員再找一次
  const deepLink = new URLSearchParams(location.search).get('taskId')
    || (window.liff && liff.state ? new URLSearchParams(liff.state.replace(/^.*\?/, '')).get('taskId') : null);

  if (profile.pictureUrl) {
    $('me-avatar').src = profile.pictureUrl;
  } else {
    // 沒有頭像就畫一個字母圓章，不要留一個空灰圈
    const initial = (profile.displayName || '調')[0];
    $('me-avatar').outerHTML =
      `<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#cbd5e1">${esc(initial)}</div>`;
  }

  await loadMyTasks();
  renderList();

  if (deepLink && DATA.tasks.some(t => t.taskId === deepLink)) {
    openTask(deepLink);
    // 圖文訊息／卡片訊息的按鈕可以帶 &action=accept，點進來就直接接單，
    // 不必再按一次（OA 卡片訊息只能開網址、無法送 postback 時就靠這條）
    const wantAccept = new URLSearchParams(location.search).get('action') === 'accept';
    if (wantAccept && taskState(currentTask).status === 'pending') {
      setTimeout(() => acceptTask(), 400);
    }
  }
})();

/** 從後端取回「已指派給我」的工單，讓任務跨裝置也看得到 */
async function loadMyTasks() {
  if (!CONFIG.apiBase || !profile.userId) return;
  try {
    const r = await fetch(`${CONFIG.apiBase.replace(/\/+$/, '')}/tasks/mine?userId=${encodeURIComponent(profile.userId)}`);
    if (!r.ok) return;
    const data = await r.json();
    myTaskIds = new Set((data.tasks || []).map(t => t.taskId));
    // 後端狀態回填本機，換手機也接得下去
    (data.tasks || []).forEach(t => {
      const cur = progress[t.taskId] || { status: 'pending', stops: {} };
      if (t.status && cur.status !== 'done') {
        progress[t.taskId] = Object.assign(cur, { status: t.status });
      }
    });
    store.set('yb_progress', progress);
  } catch (e) { /* 後端不在就沿用本機狀態 */ }
}

/* ============================================================================
   共用小工具
   ============================================================================ */
function taskState(t) {
  return progress[t.taskId] || { status: 'pending', stops: {} };
}
function saveState(taskId, patch) {
  progress[taskId] = Object.assign({ status: 'pending', stops: {} }, progress[taskId], patch);
  store.set('yb_progress', progress);
}
function doneCount(t) {
  const st = taskState(t);
  return t.stops.filter(s => st.stops[s.stationId]).length;
}
function kindText(k) { return k === 'shortage' ? '缺車' : '滿站'; }
function stopColor(s) { return s.action === 'pickup' ? '#d97706' : '#2563eb'; }

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

/** 整段路線導航：起點目前位置，途經各站 */
function routeNavUrl(t) {
  const pts = t.stops.map(s => `${s.lat},${s.lng}`);
  const dest = pts.pop();
  const wp = pts.length ? `&waypoints=${pts.join('|')}` : '';
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}${wp}&travelmode=driving`;
}
function stopNavUrl(s) {
  return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=driving`;
}
function openExternal(url) {
  if (inClient && window.liff && liff.openWindow) liff.openWindow({ url, external: true });
  else window.open(url, '_blank', 'noopener');
}

/** 後端沒接上時，所有 API 呼叫安靜失敗，不影響操作 */
async function api(path, body) {
  if (!CONFIG.apiBase) return { ok: false, offline: true };
  try {
    const r = await fetch(CONFIG.apiBase + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ userId: profile.userId }, body)),
    });
    return { ok: r.ok, status: r.status, data: await r.json().catch(() => null) };
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/* ============================================================================
   任務列表
   ============================================================================ */
function renderList() {
  const m = DATA.meta;
  $('top-title').textContent = '調度任務';
  $('top-sub').textContent = `${profile.displayName}｜${m.replayDate} 回放`;
  $('btn-back').classList.add('hide');

  const open = DATA.tasks.filter(t => taskState(t).status !== 'done');
  $('list-count').textContent = `${open.length} / ${DATA.tasks.length} 筆待處理`;
  // 順序不是時段先後，這件事要講出來，否則會被當成漏了早上的任務
  $('sort-hint').innerHTML =
    '依<b>派工緊急度</b>排序：可挽回租借次數 40 ＋ 空滿程度 25 ＋ 有效失衡時間 20 ＋ 處理效率 10 ＋ 轉運節點 5。'
    + '失衡久不等於排前面——低流量站空一小時少做的趟次，遠少於高流量站。';

  // 我接下的任務獨立一區，出勤時只要看這裡
  const mine = DATA.tasks.filter(t => {
    const st = taskState(t).status;
    return st === 'accepted' || (myTaskIds.has(t.taskId) && st !== 'done');
  });
  const mineBox = $('my-tasks');
  if (mine.length) {
    mineBox.classList.remove('hide');
    mineBox.innerHTML = `
      <div class="listhead" style="margin-top:2px">
        <b>我的任務</b><span class="tiny muted">${mine.length} 筆執行中</span>
      </div>
      ${mine.map(t => {
        const st = taskState(t);
        const done = doneCount(t);
        return `
        <button class="taskcard mine" onclick="openTask('${t.taskId}')">
          <div class="tc-top">
            <span class="pill pill-ok">執行中 ${done}/${t.stops.length} 站</span>
            <span class="tc-time">${st.acceptedAt ? new Date(st.acceptedAt).toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' }) + ' 接下' : '執行中'}</span>
          </div>
          <div class="tc-title">${esc(t.districts.join('、'))}　${t.stops.length} 站</div>
          <div class="tc-crit">下一站：${esc((t.stops.find(s => !st.stops[s.stationId]) || t.stops[0]).name)}</div>
          <div class="mine-bar"><i style="width:${Math.round(done / t.stops.length * 100)}%"></i></div>
        </button>`;
      }).join('')}
`;
    $('pending-head').style.marginTop = '22px';
  } else {
    mineBox.classList.add('hide');
    mineBox.innerHTML = '';
    $('pending-head').style.marginTop = '';
  }

  // 排序依派工緊急度，不是時段先後——這點必須與後端 nextPendingTask 和大螢幕一致，
  // 否則調度員手機上看到的順序，會跟系統「為什麼先派這一筆」的說法對不起來。
  // 已接走／已完成往下沉，不佔住待接收的位置。
  const rank = t => {
    const s = taskState(t).status;
    return s === 'done' ? 3 : s === 'taken' ? 2 : s === 'accepted' ? 1 : 0;
  };
  const ordered = DATA.tasks.slice().sort((a, b) =>
    rank(a) - rank(b) || (b.dispatchUrgency || 0) - (a.dispatchUrgency || 0));

  $('task-list').innerHTML = ordered.map((t, idx) => {
    const st = taskState(t);
    const done = st.status === 'done';
    // 只有排在最前面、且還沒被接走的那筆才標「建議先接」，標太多就等於沒標
    const top = idx === 0 && (st.status || 'pending') === 'pending';
    // 兩顆徽章各司其職：左邊只講「處理狀態」，右邊只講「嚴重程度」，不重複上色
    const badge = done ? '<span class="pill pill-ok">已完成</span>'
      : st.status === 'accepted' ? `<span class="pill pill-gray">執行中 ${doneCount(t)}/${t.stops.length}</span>`
      : st.status === 'taken' ? '<span class="pill pill-gray">已被接走</span>'
      : '<span class="pill pill-gray">待接收</span>';

    // 失衡時間分級用「營運時段內」的時數；含凌晨的原始時數會把所有卡都標成紅的
    const mins = t.criticalStation.effectiveMinutes;
    const hrs = Math.round(mins / 60 * 10) / 10;
    const sevClass = done ? 'pill-gray'
      : mins >= 180 ? 'pill-urgent'
      : mins >= 120 ? (t.criticalStation.kind === 'shortage' ? 'pill-short' : 'pill-full')
      : 'pill-gray';
    const sev = `<span class="pill ${sevClass}">${mins >= 180 ? '⚠ ' : ''}${kindText(t.criticalStation.kind)} ${hrs} 小時</span>`;
    return `
      <button class="taskcard ${done ? 'is-done' : ''} ${top ? 'is-top' : ''}" onclick="openTask('${t.taskId}')">
        <div class="tc-top">
          <span class="tc-rank">#${idx + 1}</span>
          ${top ? '<span class="pill pill-top">建議先接</span>' : ''}${badge}${sev}
        </div>
        <div class="tc-title">${esc(t.districts.join('、'))}　${t.stops.length} 站失衡</div>
        <div class="tc-crit">首要處理：${esc(t.criticalStation.name)}<span>緊急度 ${Math.round(t.dispatchUrgency)}</span></div>
        <div class="tc-stats">
          <div class="stat"><b>${Math.round(t.estimatedLostTrips)}<span style="font-size:11px"> 次</span></b><span>已流失租借</span></div>
          <div class="stat"><b>${t.etaMinutes}<span style="font-size:11px"> 分</span></b><span>預估耗時</span></div>
          <div class="stat"><b>${t.pickupTotal}<span style="font-size:11px"> 台</span></b><span>需搬運</span></div>
          <div class="tc-arrow">›</div>
        </div>
      </button>`;
  }).join('');

  const tm = m.testMetrics || {};
  const b30 = tm['bike-30'] || {}, d30 = tm['dock-30'] || {};
  $('model-footnote').innerHTML =
    `${esc(m.dataPeriod || '')}／${m.sourceStationCount} 站。` +
    `模型輸出為<b>可借／可還比例</b>（非機率）。6 月測試 MAE：可借 ${b30.MAE_ratio ?? '—'}、可還 ${d30.MAE_ratio ?? '—'}；` +
    `事件判定 F1：可借 ${b30.event_F1 ?? '—'}、可還 ${d30.event_F1 ?? '—'}。<br>` +
    `預警門檻：+30 分 可借 ${(m.warningThresholds?.['bike-30'] * 100).toFixed(1)}%、可還 ${(m.warningThresholds?.['dock-30'] * 100).toFixed(1)}%。<br>` +
    `${esc(m.sourceNote || '')}`;

  $('view-list').classList.remove('hide');
  $('view-detail').classList.add('hide');
  if (map) { map.remove(); map = null; }
  window.scrollTo(0, 0);
}

  $('top-sub').textContent = `${t.slot} 派工｜${t.stops.length} 站`;

    ? `<div class="banner banner-warn">

         <div>路線上有站點在營運時段內已失衡 ${Math.round(worst / 60 * 10) / 10} 小時（超過 2 小時人工介入門檻），請優先處理並於現場回報。</div></div>`

  const barColor = s.kind === 'shortage' ? 'var(--short)' : 'var(--full)';

  return `
    <div class="stop ${rp ? 'done' : ''}">
      <div class="stop-dot" style="background:${stopColor(s)}">${rp ? '✓' : s.label}</div>
      <div class="stop-name">${esc(s.name)}</div>
      <div class="stop-meta">${esc(s.district)} · 抵達 +${s.etaFromStartMinutes} 分 · ${esc(s.pattern)}</div>

      <div class="action-row ${pickup ? 'action-pickup' : 'action-drop'}">
        <div>
          <div class="action-lbl" style="color:${pickup ? 'var(--full)' : 'var(--brand-d)'}">${pickup ? '取出車輛' : '補入車輛'}</div>
          <div class="action-big" style="color:${pickup ? 'var(--full)' : 'var(--brand-d)'}">${Math.abs(s.moveBikes)} 台</div>
        </div>
        <div class="action-load">離站車上<b>${s.truckLoadAfter} / ${CONFIG.truckCapacity}</b></div>
      </div>

      <div class="gauge"><i style="width:${ratio}%;background:${barColor}"></i></div>
      <div class="gauge-row">
        <span>現況 ${s.bikes} / ${s.total} 柱（${ratio}%）</span>
        <span style="color:${barColor}">${kindText(s.kind)}${s.immediate
          ? ' 即時事件'
          : ` +${s.horizon}分 預測${s.kind === 'shortage' ? '可借' : '可還'} ${(s.ratio * 100).toFixed(1)}%`}</span>
      </div>

      <div class="why">營運時段內已失衡 ${s.effectiveMinutes} 分鐘，該站每小時約 ${s.flowPerHour} 次借還，<b style="color:var(--ink)">估計已流失 ${s.lostTrips} 次租借</b>${s.geoTags.length ? '；周邊 ' + esc(s.geoTags.slice(0, 3).join('、')) : ''}</div>

      ${rp ? `<div class="why" style="color:var(--ok);font-weight:700">已回報：實際${pickup ? '取出' : '補入'} ${rp.count} 台 · ${esc(rp.condition)}${rp.note ? ' · ' + esc(rp.note) : ''}</div>` : ''}

      <div class="stop-btns">
        <button class="btn btn-nav" onclick='openExternal(${JSON.stringify(stopNavUrl(s))})'>
          <svg viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>導航
        </button>
        <button class="btn btn-done ${rp ? 'is-done' : ''}" onclick="openSheet('${s.stationId}')">
          ${rp ? '修改回報' : '到站回報'}
        </button>
      </div>
    </div>`;
}

/* ============================================================================
   地圖
   ============================================================================ */
function drawMap(t) {
  if (map) { map.remove(); map = null; }

  // 現場網路不穩時圖磚可能載不出來，先確認 Leaflet 本身在
  if (!window.L) { renderRouteStrip(t, '離線模式'); return; }

  try {
    map = L.map('map', { zoomControl: false, attributionControl: false, tap: false });
    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    // 圖磚 3.5 秒內沒載到就退回文字路線條，不讓畫面開天窗
    let tilesOk = false;
    tiles.on('load', () => { tilesOk = true; });
    setTimeout(() => {
      if (!tilesOk && map) { map.remove(); map = null; renderRouteStrip(t, '地圖圖磚載入逾時'); }
    }, 3500);
    tiles.addTo(map);

    const pts = t.stops.map(s => [s.lat, s.lng]);
    L.polyline(pts, { color: '#1e293b', weight: 4, opacity: .55, dashArray: '7 6' }).addTo(map);

    t.stops.forEach(s => {
      L.marker([s.lat, s.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="rt-marker" style="background:${stopColor(s)}">${s.label}</div>`,
          iconSize: [28, 28], iconAnchor: [14, 14],
        })
      }).addTo(map).bindPopup(
        `<b>${esc(s.name)}</b><br>${s.action === 'pickup' ? '取出' : '補入'} ${Math.abs(s.moveBikes)} 台<br>現況 ${s.bikes}/${s.total}`
      );
    });

    map.fitBounds(L.latLngBounds(pts), { padding: [34, 34], maxZoom: 16 });
    setTimeout(() => map && map.invalidateSize(), 120);
  } catch (e) {
    map = null;
    renderRouteStrip(t, '地圖無法顯示');
  }
}

/** 地圖的備援：用文字條呈現同一條路線，資訊不遺失 */
function renderRouteStrip(t, reason) {
  const el = $('map');
  if (!el) return;
  el.className = 'route-strip';
  el.innerHTML = `
    <div class="rs-head">路線總覽<span>${esc(reason)}</span></div>
    <div class="rs-body">
      ${t.stops.map((s, i) => `
        ${i ? '<div class="rs-arrow">→</div>' : ''}
        <div class="rs-node">
          <div class="rt-marker" style="background:${stopColor(s)};box-shadow:none;margin:0 auto 5px">${s.label}</div>
          <div class="rs-name">${esc(s.name)}</div>
          <div class="rs-move" style="color:${s.action === 'pickup' ? 'var(--full)' : 'var(--brand-d)'}">
            ${s.action === 'pickup' ? '取' : '補'} ${Math.abs(s.moveBikes)}
          </div>
        </div>`).join('')}
    </div>`;
}

/* ============================================================================
   接受 / 婉拒 / 完成
   ============================================================================ */
async function acceptTask() {
  const t = currentTask;
  const r = await api('/tasks/accept', { taskId: t.taskId });

  // 搶單失敗：別人先接走了。必須擋下來，否則兩個人會跑同一條路線。
  if (r.status === 409) {
    saveState(t.taskId, { status: 'taken' });
    toast('這筆已被其他調度員接走');
    setTimeout(goList, 900);
    return;
  }

  saveState(t.taskId, { status: 'accepted', acceptedAt: Date.now() });
  myTaskIds.add(t.taskId);
  // 在 LINE 聊天室留下接單紀錄，調度中心看得到
  if (inClient && window.liff && liff.sendMessages) {
    try {
      await liff.sendMessages([{ type: 'text', text: `✅ 已接受派工 ${t.taskId}｜${t.districts.join('、')} ${t.stops.length} 站，預估 ${t.etaMinutes} 分鐘` }]);
    } catch {}
  }
  toast('已接單，開始執行');
  renderDetail();
}

async function declineTask() {
  const t = currentTask;
  saveState(t.taskId, { status: 'pending', declined: true });
  await api('/tasks/decline', { taskId: t.taskId });
  if (inClient && window.liff && liff.sendMessages) {
    try { await liff.sendMessages([{ type: 'text', text: `❌ 目前無法承接 ${t.taskId}，請改派其他調度員` }]); } catch {}
  }
  toast('已回覆調度中心，將改派其他人');
  setTimeout(goList, 700);
}

async function finishTask() {
  const t = currentTask;
  if (doneCount(t) < t.stops.length) return;
  saveState(t.taskId, { status: 'done', finishedAt: Date.now() });
  await api('/tasks/finish', { taskId: t.taskId });
  if (inClient && window.liff && liff.sendMessages) {
    try {
      const moved = t.stops.reduce((n, s) => n + (taskState(t).stops[s.stationId]?.count || 0), 0);
      await liff.sendMessages([{ type: 'text', text: `🏁 ${t.taskId} 已完成｜${t.stops.length} 站、實際搬運 ${moved} 台` }]);
    } catch {}
  }
  toast('整趟任務已完成，感謝');
  renderDetail();
}

/* ============================================================================
   到站回報
   ============================================================================ */
const CONDITIONS = ['一切正常', '車柱故障', '現場車輛損壞', '無法停靠', '車輛已被騎走', '其他'];
let pickedCondition = CONDITIONS[0];

function openSheet(stationId) {
  const t = currentTask;
  const s = t.stops.find(x => x.stationId === stationId);
  const prev = taskState(t).stops[stationId];
  sheetCtx = { taskId: t.taskId, stop: s };

  $('sheet-title').textContent = `${s.label}　${s.name}`;
  $('sheet-sub').textContent = `系統建議${s.action === 'pickup' ? '取出' : '補入'} ${Math.abs(s.moveBikes)} 台 · 現況 ${s.bikes}/${s.total}`;
  $('rp-count').value = prev ? prev.count : Math.abs(s.moveBikes);
  $('rp-note').value = prev ? (prev.note || '') : '';
  pickedCondition = prev ? prev.condition : CONDITIONS[0];
  $('rp-hint').textContent = `建議值 ${Math.abs(s.moveBikes)} 台，可依現場實況調整`;
  renderChips();

  $('backdrop').classList.add('open');
  $('sheet').classList.add('open');
}

function renderChips() {
  $('rp-chips').innerHTML = CONDITIONS.map(c =>
    `<button type="button" class="chip ${c === pickedCondition ? 'on' : ''}" onclick="pickCondition('${c}')">${c}</button>`
  ).join('');
}
function pickCondition(c) { pickedCondition = c; renderChips(); }

function closeSheet() {
  $('backdrop').classList.remove('open');
  $('sheet').classList.remove('open');
  sheetCtx = null;
}

function bumpCount(d) {
  const el = $('rp-count');
  el.value = Math.max(0, Math.min(40, (parseInt(el.value, 10) || 0) + d));
}

async function submitReport() {
  if (!sheetCtx) return;
  const { taskId, stop } = sheetCtx;
  const count = Math.max(0, parseInt($('rp-count').value, 10) || 0);
  const note = $('rp-note').value.trim();
  const record = {
    count, condition: pickedCondition, note,
    suggested: Math.abs(stop.moveBikes),
    action: stop.action,
    ts: new Date().toISOString(),
  };

  const st = taskState(currentTask);
  st.stops[stop.stationId] = record;
  saveState(taskId, { stops: st.stops });

  // 這筆回報就是後續模型再訓練的標記資料
  await api('/reports', {
    taskId, stationId: stop.stationId, stationName: stop.name,
    ...record,
  });

  closeSheet();
  const diff = count - Math.abs(stop.moveBikes);
  toast(diff === 0 ? '已回報，與建議一致' : `已回報，較建議${diff > 0 ? '多' : '少'} ${Math.abs(diff)} 台`);
  renderDetail();
}

/* ============================================================================
   AI 說明（Gemini 由後端代打，前端只負責顯示與退回模板）
   ============================================================================ */
async function regenExplain() {
  const t = currentTask;
  const btn = $('btn-regen');
  btn.disabled = true;
  $('ai-body').innerHTML = '<div class="skeleton" style="width:100%"></div><div class="skeleton" style="width:92%"></div><div class="skeleton" style="width:74%"></div>';
  $('ai-src').textContent = '產生中…';

  const r = await api('/explain', { taskId: t.taskId });
  if (r.ok && r.data && r.data.text) {
    t.aiExplain = r.data.text;
    $('ai-body').textContent = r.data.text;
    $('ai-src').textContent = 'Gemini 生成 · ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } else {
    $('ai-body').textContent = t.aiExplainFallback;
    $('ai-src').textContent = '規則模板生成';
  }
  btn.disabled = false;
}
</script>
